name: Build Electron desktop

on:
  workflow_dispatch:
  push:
    tags:
      # Both "1.2.0" and "v1.2.0" tags build and publish a GitHub Release.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
            executable: dist/electron/win-unpacked/Devkit.exe
          - os: macos-15
            arch: arm64
            target: mac
            executable: dist/electron/mac-arm64/Devkit.app/Contents/MacOS/Devkit
          - os: macos-15-intel
            arch: x64
            target: mac
            executable: dist/electron/mac/Devkit.app/Contents/MacOS/Devkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME không khớp version $VERSION trong package.json. Hãy sửa version rồi tạo lại tag."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build installer
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged app
        run: node scripts/check-electron.mjs --packaged "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Devkit-Electron-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/electron/*-Setup.exe
            dist/electron/*.dmg
            dist/electron/*.zip
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Electron-diagnostics-${{ matrix.target }}-${{ matrix.arch }}
          include-hidden-files: true
          path: |
            .build/electron-smoke-*/electron-smoke.json
            .build/electron-smoke-*/electron-smoke.png
            .build/electron-smoke-*/electron.log

  release:
    # Publishes the installers so the in-app updater can find them.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Devkit-Electron-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: |
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -la
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Upload into a draft first so the updater never sees a release without files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "v${TAG#v}" --generate-notes --verify-tag
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
